<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hera tasma</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
         display: flex; flex-direction: column; gap: 14px; padding: 16px; min-height: 100vh; box-sizing: border-box; }
  #status { text-align: center; font-size: 1.1rem; min-height: 1.4em; }
  button { border: 0; border-radius: 16px; font-size: 2rem; font-weight: 600; color: #fff; padding: 0; }
  button:disabled { opacity: .35; }
  #connect { background: #2d5be3; font-size: 1.3rem; padding: 18px; }
  .cue { flex: 1; min-height: 110px; }
  [data-cue="1"] { background: #1f8a4c; }
  [data-cue="2"] { background: #b8860b; }
  [data-cue="3"] { background: #c0392b; }
  #volrow { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; }
  #tonerow { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; }
  #hz { flex: 1; height: 40px; }
  #try { font-size: 1.1rem; padding: 10px 16px; background: #555; }
  #vol { flex: 1; height: 40px; accent-color: #2d5be3; }
</style>
</head>
<body>
<div id="status">Bağlı değil</div>
<button id="connect">Bağlan</button>
<label id="volrow">Ses <input id="vol" type="range" min="0" max="100" step="5" value="30" disabled> <span id="volval">30</span></label>
<label id="tonerow">Ton <input id="hz" type="range" min="1500" max="5000" step="100" value="2800" disabled> <span id="hzval">2800</span> Hz <button id="try" disabled>Dene</button></label>
<button class="cue" data-cue="1" disabled>Gel</button>
<button class="cue" data-cue="2" disabled>Otur</button>
<button class="cue" data-cue="3" disabled>Aferin</button>
<script>
  // Must match firmware/collar/src/main.cpp
  const SERVICE = 'c0a1c0de-0000-4000-8000-000000000001';
  const CUE_CHAR = 'c0a1c0de-0000-4000-8000-000000000002';
  const LOCK_MS = 500; // longest cue (otur) is 500 ms

  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connect');
  const cueBtns = [...document.querySelectorAll('.cue'), document.getElementById('try'), document.getElementById('hz')];
  const hzEl = document.getElementById('hz');
  const hzValEl = document.getElementById('hzval');
  const volEl = document.getElementById('vol');
  const volValEl = document.getElementById('volval');
  try { const v = localStorage.getItem('hera-vol'); if (v !== null) volEl.value = v; } catch {}
  volValEl.textContent = volEl.value;
  let device = null;
  let cueChar = null;

  const setStatus = (text) => { statusEl.textContent = text; };
  const setCuesEnabled = (on) => cueBtns.forEach((b) => { b.disabled = !on; });
  // Firmware protocol: 'v' + one byte 0-100; 100 = firmware's capped maximum.
  const sendVolume = () => cueChar && cueChar.writeValueWithoutResponse(new Uint8Array([0x76, Number(volEl.value)]));

  async function attach() {
    setStatus('Bağlanıyor…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    cueChar = await svc.getCharacteristic(CUE_CHAR);
    await sendVolume();
    setStatus('Bağlı: ' + (device.name || 'tasma'));
    setCuesEnabled(true);
    volEl.disabled = false;
  }

  async function onDisconnected() {
    cueChar = null;
    setCuesEnabled(false);
    volEl.disabled = true;
    setStatus('Bağlantı koptu, yeniden deneniyor…');
    for (let i = 0; i < 5 && device; i++) {
      try { await attach(); return; } catch { await new Promise((r) => setTimeout(r, 1000)); }
    }
    setStatus('Bağlantı yok — Bağlan\'a bas');
  }

  connectBtn.addEventListener('click', async () => {
    if (!navigator.bluetooth) { setStatus('Bu tarayıcıda Web Bluetooth yok (Android Chrome kullan)'); return; }
    try {
      device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
      device.addEventListener('gattserverdisconnected', onDisconnected);
      await attach();
    } catch (e) {
      setStatus('Hata: ' + e.message);
    }
  });

  volEl.addEventListener('input', () => { volValEl.textContent = volEl.value; });
  volEl.addEventListener('change', async () => {
    try { localStorage.setItem('hera-vol', volEl.value); } catch {}
    try { await sendVolume(); } catch (e) { setStatus('Ses gönderilemedi: ' + e.message); }
  });

  hzEl.addEventListener('input', () => { hzValEl.textContent = hzEl.value; });
  // Firmware protocol: 't' + hz (u16 LE) + ms (u16 LE); test tone to find the piezo's loud band.
  document.getElementById('try').addEventListener('click', async () => {
    if (!cueChar) return;
    const b = new DataView(new ArrayBuffer(5));
    b.setUint8(0, 0x74); b.setUint16(1, Number(hzEl.value), true); b.setUint16(3, 300, true);
    try { await cueChar.writeValueWithoutResponse(b.buffer); } catch (e) { setStatus('Gönderilemedi: ' + e.message); }
  });

  cueBtns.filter((b) => b.dataset.cue).forEach((btn) => btn.addEventListener('click', async () => {
    if (!cueChar) return;
    setCuesEnabled(false);
    try {
      await cueChar.writeValueWithoutResponse(new TextEncoder().encode(btn.dataset.cue));
    } catch (e) {
      setStatus('Gönderilemedi: ' + e.message);
    }
    setTimeout(() => { if (cueChar) setCuesEnabled(true); }, LOCK_MS);
  }));
</script>
</body>
</html>
